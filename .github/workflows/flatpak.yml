name: Flatpak

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: flatpak
  cancel-in-progress: false

env:
  APP_ID: io.github.jic8.Volna
  BRANCH: stable
  BUNDLE: Volna.flatpak
  SITE_URL: https://jic8.github.io/volna

jobs:
  build:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = release ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --default-branch="$BRANCH" --repo=repo --force-clean \
            build-dir build-aux/$APP_ID.json
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "$BUNDLE" "$APP_ID" "$BRANCH"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" "$BUNDLE" --clobber -R "$GITHUB_REPOSITORY"

  pages:
    needs: build
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          echo "KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "GPG_PUB=$(gpg --export "$KEY_ID" | base64 -w0)" >> "$GITHUB_ENV"

      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp -r docs _site
          gh release download -R "$GITHUB_REPOSITORY" -p "$BUNDLE" || { echo "No release bundle yet, deploying docs only"; exit 0; }

          ostree init --mode=archive-z2 --repo=_site/repo
          flatpak build-import-bundle --gpg-sign="$KEY_ID" _site/repo "$BUNDLE"
          flatpak build-update-repo --gpg-sign="$KEY_ID" --title=Volna \
            --default-branch="$BRANCH" --generate-static-deltas --prune _site/repo

          cat > _site/volna.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Volna
          Url=$SITE_URL/repo/
          Homepage=$SITE_URL/
          Icon=$SITE_URL/icon.svg
          GPGKey=$GPG_PUB
          EOF

          cat > _site/volna.flatpakref <<EOF
          [Flatpak Ref]
          Name=$APP_ID
          Branch=$BRANCH
          Title=Volna
          Url=$SITE_URL/repo/
          SuggestRemoteName=volna
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          IsRuntime=false
          GPGKey=$GPG_PUB
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
